name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ocaml-nox
      - run: ./build.sh
      - run: ./tests/run.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: install ocaml
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y ocaml-nox
          else
            brew install ocaml
          fi
      - run: ./build.sh
      - run: mv repowatch "repowatch-${{ matrix.os }}"
      - uses: softprops/action-gh-release@v2
        with:
          files: repowatch-*
